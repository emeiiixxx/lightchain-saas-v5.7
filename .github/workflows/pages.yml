name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Avoid cache restore stalls when Actions cache egress is rate-limited.
      - run: npm ci
      - run: node scripts/sync-asset-aliases.mjs --check
      - run: node scripts/run-canvas-performance-tests.mjs
      - run: node scripts/run-flow-layout-tests.mjs
      - run: node --test tests/react-flow-selection.test.mjs tests/react-flow-workspace-isolation.test.mjs
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          for attempt in {1..24}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\" and (.id | tostring) == \"$PAGES_ARTIFACT_ID\" and .expired == false) | .id" \
              | grep -qx "$PAGES_ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Uploaded Pages artifact is not yet available.' >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 600000
